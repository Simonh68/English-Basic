<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>שיעור מספר 2 – מילים ואיות</title>
  <style>
    :root{--green:#20a663;--dark:#111;--muted:#678074;--pale:#eaf8f0}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#e6f7ee;color:var(--dark)}
    body{display:grid;grid-template-rows:1fr auto;touch-action:pan-y}
    .viewport{position:relative;overflow:hidden;direction:ltr}
    .track{height:100%;display:flex;transition:transform .32s ease;will-change:transform}
    .card{min-width:100%;height:100%;padding:clamp(18px,5vw,44px);display:grid;place-items:center;direction:rtl}
    .card-inner{width:min(760px,100%);min-height:min(72vh,650px);padding:clamp(24px,7vw,58px) clamp(16px,6vw,48px);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:28px;background:#fff;box-shadow:0 16px 45px #13583724;text-align:center}
    .word{direction:ltr;max-width:100%;margin:0;color:#111;font-size:clamp(3rem,14vw,7.5rem);font-weight:800;line-height:1.05;overflow-wrap:anywhere;transition:color .25s ease}
    .word.done{color:var(--green)}
    .translation{margin-top:clamp(18px,4vh,34px);font-size:clamp(1.8rem,7vw,3.6rem);font-weight:700;color:#263d34}
    .letters{direction:ltr;width:100%;min-height:clamp(62px,12vh,105px);margin-top:clamp(26px,6vh,52px);display:flex;align-items:center;justify-content:center;gap:clamp(2px,1.2vw,10px)}
    .letter{flex:0 1 auto;min-width:0;color:#111;font-size:clamp(2rem,10vw,5.5rem);font-weight:500;line-height:1;transition:color .12s,transform .12s,font-weight .12s}
    .letter.active{color:var(--green);font-weight:900;transform:scale(1.18)}
    .status{min-height:24px;margin-top:24px;color:var(--muted);font-weight:700;font-size:clamp(1rem,3.5vw,1.25rem)}
    .cover-inner{background:linear-gradient(145deg,#fff9db,#ffe8f2 48%,#e5f7ff);border:4px solid #fff;box-shadow:0 18px 52px #79396828}
    .cover-emoji{font-size:clamp(3.5rem,14vw,7rem);line-height:1;margin-bottom:24px}
    .cover-title{margin:0;max-width:650px;font-size:clamp(2.1rem,9vw,5rem);line-height:1.25;color:#e34882;text-shadow:2px 3px 0 #fff}
    .cover-title span{color:#7b55cc}
    .cover-message{margin:clamp(22px,5vh,38px) 0 0;font-size:clamp(1.45rem,6vw,3rem);font-weight:800;line-height:1.45;color:#147f8e}
    .cover-count{display:inline-block;margin-top:24px;padding:10px 22px;border-radius:999px;background:#fff;color:#e16b22;font-size:clamp(1.2rem,4.5vw,2rem);font-weight:900;box-shadow:0 6px 18px #b76f3127}
    .finish-inner{background:linear-gradient(145deg,#fff4bd,#ffe1f1 45%,#dff7ff);border:5px solid #fff;box-shadow:0 18px 55px #853b702c}
    .finish-emoji{font-size:clamp(3.5rem,15vw,7.5rem);line-height:1.05;animation:celebrate 1.2s ease-in-out infinite alternate}
    .finish-title{margin:24px 0 0;font-size:clamp(2.3rem,10vw,5.4rem);line-height:1.15;color:#df3f86;text-shadow:2px 3px 0 #fff}
    .finish-message{margin:clamp(18px,4vh,32px) 0 0;font-size:clamp(1.45rem,6vw,3rem);font-weight:900;line-height:1.45;color:#6350b5}
    .finish-badge{display:inline-block;margin-top:24px;padding:12px 25px;border-radius:999px;background:#22a866;color:#fff;font-size:clamp(1.2rem,4.5vw,2rem);font-weight:900;box-shadow:0 7px 0 #167746}
    @keyframes celebrate{from{transform:rotate(-3deg) scale(.97)}to{transform:rotate(3deg) scale(1.05)}}
    .arrow{position:absolute;z-index:3;top:50%;transform:translateY(-50%);width:46px;height:62px;border:0;border-radius:14px;background:#ffffffdf;color:var(--green);font-size:2rem;font-weight:900;box-shadow:0 5px 18px #133b2825;cursor:pointer}
    .arrow:disabled{opacity:.2;cursor:default}
    #previous{left:10px} #next{right:10px}
    footer{padding:10px 14px 16px;text-align:center;background:#e6f7ee}
    .dots{direction:ltr;display:flex;justify-content:center;gap:8px}
    .dot{width:10px;height:10px;padding:0;border:0;border-radius:50%;background:#a5c8b5;cursor:pointer}
    .dot.active{background:var(--green);transform:scale(1.35)}
    .hint{margin:8px 0 0;color:#527064;font-size:.9rem}
    @media(max-width:520px){.arrow{top:auto;bottom:8px;width:42px;height:46px}.card-inner{min-height:74vh}.letters{gap:4px}}
    @media(prefers-reduced-motion:reduce){.track,.word,.letter{transition:none}}
  </style>
</head>
<body>
  <div class="viewport" id="viewport">
    <div class="track" id="track"></div>
    <button class="arrow" id="previous" type="button" aria-label="הכרטיסייה הקודמת">‹</button>
    <button class="arrow" id="next" type="button" aria-label="הכרטיסייה הבאה">›</button>
  </div>
  <footer>
    <div class="dots" id="dots" aria-label="בחירת כרטיסייה"></div>
    <p class="hint">החליקו ימינה או שמאלה למעבר בין המילים</p>
  </footer>

  <script>
    const words = [
      ['family','משפחה'], ['friend','חבר או חברה'], ['happy','שמח או שמחה'],
      ['small','קטן או קטנה'], ['big','גדול או גדולה'], ['home','בית'],
      ['food','אוכל'], ['water','מים'], ['morning','בוקר'], ['night','לילה']
    ];
    const track = document.querySelector('#track');
    const dotsBox = document.querySelector('#dots');
    const previousButton = document.querySelector('#previous');
    const nextButton = document.querySelector('#next');
    const viewport = document.querySelector('#viewport');
    let current = 0;
    let runId = 0;
    let startX = null;

    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
    const cover = document.createElement('section');
    cover.className = 'card';
    cover.setAttribute('aria-label', 'כרטיסיית שער');
    cover.innerHTML = `<div class="card-inner cover-inner"><div class="cover-emoji">🦁 💖 🌈</div><h1 class="cover-title">למעיין <span>הלביאה המתוקה</span></h1><p class="cover-message">אבא הכין לך שיעור 🎁<br>נא לעבור לכרטיסייה הבאה 👈</p><div class="cover-count">שיעור מספר 2: עשר מילים בלבד ⭐</div></div>`;
    track.append(cover);

    const lessonCards = words.map(([word, translation], index) => {
      const card = document.createElement('section');
      card.className = 'card';
      card.setAttribute('aria-label', `מילה ${index + 1} מתוך ${words.length}`);
      card.innerHTML = `<div class="card-inner"><h1 class="word" lang="en">${word}</h1><div class="translation">${translation}</div><div class="letters" aria-label="${word}">${[...word].map(letter => `<span class="letter">${letter.toUpperCase()}</span>`).join('')}</div><div class="status" role="status" aria-live="polite"></div></div>`;
      track.append(card);
      return card;
    });
    const finish = document.createElement('section');
    finish.className = 'card';
    finish.setAttribute('aria-label', 'כרטיסיית סיום');
    finish.innerHTML = `<div class="card-inner finish-inner"><div class="finish-emoji">🎉 🏆 🎊</div><h1 class="finish-title">כל הכבוד, מעיין!</h1><p class="finish-message">סיימת את שיעור מספר 2 בהצלחה! 🌟<br>אבא גאה בך מאוד 💖</p><div class="finish-badge">אלופת המילים 👑</div></div>`;
    track.append(finish);
    const cards = [cover, ...lessonCards, finish];

    cards.forEach((card, index) => {
      const dot = document.createElement('button');
      dot.className = 'dot';
      dot.type = 'button';
      dot.setAttribute('aria-label', index === 0 ? 'עבור לכרטיסיית השער' : index === cards.length - 1 ? 'עבור לכרטיסיית הסיום' : `עבור למילה ${index} מתוך ${words.length}`);
      dot.addEventListener('click', () => goTo(index));
      dotsBox.append(dot);
    });
    const dots = [...dotsBox.children];

    function englishVoice(){
      const voices = speechSynthesis.getVoices();
      return voices.find(v => v.lang === 'en-US') || voices.find(v => v.lang.startsWith('en')) || null;
    }

    function speak(text, rate, id){
      return new Promise(resolve => {
        if(id !== runId) return resolve();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = rate;
        const voice = englishVoice();
        if(voice) utterance.voice = voice;
        utterance.onend = resolve;
        utterance.onerror = resolve;
        speechSynthesis.speak(utterance);
      });
    }

    async function readCard(index){
      const id = ++runId;
      speechSynthesis.cancel();
      lessonCards.forEach(card => {
        card.querySelector('.word').classList.remove('done');
        card.querySelectorAll('.letter').forEach(el => el.classList.remove('active'));
        card.querySelector('.status').textContent = '';
      });
      if(index === 0 || index === cards.length - 1) return;
      const wordIndex = index - 1;
      const card = lessonCards[wordIndex];
      const word = words[wordIndex][0];
      const wordElement = card.querySelector('.word');
      const letterElements = [...card.querySelectorAll('.letter')];
      const status = card.querySelector('.status');

      status.textContent = 'ממתינים…';
      await sleep(900);
      if(id !== runId) return;
      status.textContent = 'המילה';
      await speak(word, .8, id);
      if(id !== runId) return;
      status.textContent = 'איות';
      for(let i = 0; i < word.length; i++){
        if(id !== runId) return;
        letterElements.forEach(el => el.classList.remove('active'));
        letterElements[i].classList.add('active');
        const started = performance.now();
        await speak(word[i].toUpperCase(), 1, id);
        const remaining = 200 - (performance.now() - started);
        if(remaining > 0) await sleep(remaining);
      }
      if(id !== runId) return;
      letterElements.forEach(el => el.classList.remove('active'));
      status.textContent = 'שוב: המילה';
      await speak(word, .8, id);
      if(id !== runId) return;
      wordElement.classList.add('done');
      status.textContent = 'הסתיים';
    }

    function goTo(index){
      const nextIndex = Math.max(0, Math.min(cards.length - 1, index));
      current = nextIndex;
      track.style.transform = `translateX(-${current * 100}%)`;
      dots.forEach((dot, i) => dot.classList.toggle('active', i === current));
      previousButton.disabled = current === 0;
      nextButton.disabled = current === cards.length - 1;
      readCard(current);
    }

    previousButton.addEventListener('click', () => goTo(current - 1));
    nextButton.addEventListener('click', () => goTo(current + 1));
    viewport.addEventListener('pointerdown', event => { startX = event.clientX; });
    viewport.addEventListener('pointerup', event => {
      if(startX === null) return;
      const distance = event.clientX - startX;
      startX = null;
      if(Math.abs(distance) < 45) return;
      goTo(current + (distance < 0 ? 1 : -1));
    });
    viewport.addEventListener('pointercancel', () => { startX = null; });
    document.addEventListener('keydown', event => {
      if(event.key === 'ArrowLeft') goTo(current - 1);
      if(event.key === 'ArrowRight') goTo(current + 1);
    });
    window.addEventListener('beforeunload', () => speechSynthesis.cancel());
    speechSynthesis.getVoices();
    goTo(0);
  </script>
</body>
</html>
