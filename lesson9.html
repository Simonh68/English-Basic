<style>
@import url('https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap');
:root{--green:#169b5b;--blue:#456fd1;--ink:#172033;--muted:#607368}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,"Noto Sans Hebrew",sans-serif;background:linear-gradient(145deg,#e6f7ee,#edf3ff 55%,#fff4dc);color:var(--ink)}body{display:grid;grid-template-rows:1fr auto;touch-action:pan-y}.viewport{position:relative;overflow:hidden;direction:ltr}.track{height:100%;display:flex;transition:transform .32s ease;will-change:transform}.card{min-width:100%;height:100%;padding:clamp(12px,4vw,34px);display:grid;place-items:center;direction:rtl}.card-inner{position:relative;isolation:isolate;overflow:hidden;width:min(760px,100%);min-height:min(70vh,630px);padding:clamp(24px,7vw,58px) clamp(16px,6vw,48px);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:30px;background:linear-gradient(150deg,#fff 0 62%,#eef8ff 100%);box-shadow:0 18px 48px #173a6a24;text-align:center;border:3px solid #ffffffcc}.card-inner:before,.card-inner:after{content:"";position:absolute;z-index:-1;border-radius:50%;opacity:.38}.card-inner:before{width:210px;height:210px;top:-100px;right:-80px;background:#9adbc1}.card-inner:after{width:180px;height:180px;bottom:-100px;left:-65px;background:#a9c6ff}.word{font-family:"Andika","Comic Sans MS",sans-serif;direction:ltr;max-width:100%;margin:0;color:#111;font-size:clamp(3rem,14vw,7.5rem);font-weight:850;line-height:1.05;overflow-wrap:anywhere;transition:color .25s}.word.done{color:var(--green)}.translation{margin-top:clamp(18px,4vh,34px);font-size:clamp(1.8rem,7vw,3.6rem);font-weight:750;color:#27483b}.letters{direction:ltr;width:100%;min-height:clamp(62px,12vh,105px);margin-top:clamp(26px,6vh,52px);display:flex;align-items:center;justify-content:center;gap:clamp(2px,1.2vw,10px)}.letter{font-family:"Andika","Comic Sans MS",sans-serif;flex:0 1 auto;min-width:0;color:#172033;font-size:clamp(2rem,10vw,5.5rem);font-weight:500;line-height:1;transition:color .12s,transform .12s,font-weight .12s}.letter.active{color:var(--green);font-weight:900;transform:scale(1.18)}.status{min-height:25px;margin-top:22px;color:var(--muted);font-weight:700;font-size:clamp(1rem,3.5vw,1.25rem)}.cover-inner{background:linear-gradient(145deg,#fff6d8,#edf5ff 48%,#e7faef)}.cover-icon,.finish-icon{font-size:clamp(3rem,12vw,6rem);line-height:1;margin-bottom:16px}.cover-title,.finish-title{margin:0;font-size:clamp(2.25rem,9vw,5rem);line-height:1.18;color:#395fbd}.cover-message,.finish-message{margin:clamp(14px,4vh,28px) 0 0;font-size:clamp(1.4rem,5.5vw,2.8rem);font-weight:800;line-height:1.45;color:#28775a}.cover-count,.finish-badge{display:inline-block;margin-top:18px;padding:11px 23px;border-radius:999px;background:#fff;color:#c36422;font-size:clamp(1.15rem,4.5vw,1.9rem);font-weight:900;box-shadow:0 6px 18px #8a5b2822}.finish-inner{background:linear-gradient(145deg,#e5f8ed,#fff5d5 52%,#e9efff)}.finish-title{color:#168b55}.finish-badge{background:#456fd1;color:#fff}.copy-link{margin-top:16px;padding:10px 18px;border:0;border-radius:12px;background:#e64f91;color:#fff;font:800 clamp(.95rem,3.7vw,1.15rem) Arial,sans-serif;box-shadow:0 4px 0 #a92d66;cursor:pointer}.maker{margin:13px 0 0;color:#6b7280;font-size:clamp(.72rem,2.6vw,.86rem);direction:ltr}.arrow{position:absolute;z-index:3;top:50%;transform:translateY(-50%);width:46px;height:62px;border:0;border-radius:14px;background:#ffffffdf;color:var(--green);font-size:2rem;font-weight:900;box-shadow:0 5px 18px #133b2825;cursor:pointer}.arrow:disabled{opacity:.2;cursor:default}#previous{left:10px}#next{right:10px}footer{padding:7px 12px max(10px,env(safe-area-inset-bottom));background:#e8f5ef}.dots{direction:ltr;display:flex;justify-content:center;gap:7px}.dot{width:9px;height:9px;padding:0;border:0;border-radius:50%;background:#a5c8b5}.dot.active{background:var(--green);transform:scale(1.35)}.lesson-nav{margin-top:8px;min-height:38px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}.lesson-link{display:block;padding:8px 12px;border-radius:12px;background:#456fd1;color:#fff;text-decoration:none;font-weight:800;text-align:center;box-shadow:0 4px 0 #2e4d9a}.previous-lesson{grid-column:1}.next-lesson{grid-column:2;background:#169b5b;box-shadow:0 4px 0 #0f6b3e}@media(max-width:520px){.arrow{top:auto;bottom:6px;width:42px;height:45px}.card-inner{min-height:68vh}.letters{gap:4px}}@media(max-height:680px){.card{padding:5px 10px}.card-inner{min-height:62vh;padding:12px}.translation,.letters{margin-top:12px}.status{margin-top:7px}.cover-icon,.finish-icon{margin-bottom:7px}.cover-message,.finish-message{margin-top:7px}.cover-count,.finish-badge,.copy-link{margin-top:8px}.maker{margin-top:7px}}
.home-link{position:fixed;z-index:9;top:max(10px,env(safe-area-inset-top));right:12px;padding:9px 13px;border-radius:12px;background:#fff;color:#3455a5;text-decoration:none;font-weight:900;box-shadow:0 4px 14px #173a6a28}</style></head>
<body><a class="home-link" href="index.html" aria-label="חזרה לדף הבית">⌂ דף הבית</a><div class="viewport" id="viewport"><div class="track" id="track"></div><button class="arrow" id="previous" type="button" aria-label="הכרטיסייה הקודמת">‹</button><button class="arrow" id="next" type="button" aria-label="הכרטיסייה הבאה">›</button></div><footer><div class="dots" id="dots" aria-label="בחירת כרטיסייה"></div><nav class="lesson-nav" aria-label="מעבר בין שיעורים"><a class="lesson-link previous-lesson" href="lesson8.html">→ לשיעור הקודם</a><a class="lesson-link next-lesson" href="lesson10.html">לשיעור הבא ←</a></nav></footer>
<script>
const lessonNumber=9,words=[["mother","אימא"],["father","אבא"],["sister","אחות"],["brother","אח"],["teacher","מורה"],["doctor","רופא או רופאה"],["room","חדר"],["street","רחוב"],["city","עיר"],["country","מדינה"]];const track=document.querySelector('#track'),dotsBox=document.querySelector('#dots'),previousButton=document.querySelector('#previous'),nextButton=document.querySelector('#next'),viewport=document.querySelector('#viewport');let current=0,runId=0,startX=null;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const cover=document.createElement('section');cover.className='card';cover.setAttribute('aria-label','כרטיסיית שער');cover.innerHTML=`<div class="card-inner cover-inner"><div class="cover-icon">📚 ✨</div><h1 class="cover-title">רמה 1 · שיעור ${lessonNumber}</h1><p class="cover-message">עשר מילים חדשות<br>מוכנים להתחיל?</p><div class="cover-count">החליקו לכרטיסייה הבאה</div><button class="copy-link" type="button">🔗 העתקת קישור לשיעור</button><p class="maker">Made Simon H</p></div>`;track.append(cover);
const lessonCards=words.map(([word,translation],i)=>{const card=document.createElement('section');card.className='card';card.setAttribute('aria-label',`מילה ${i+1} מתוך ${words.length}`);card.innerHTML=`<div class="card-inner"><h1 class="word" lang="en">${word}</h1><div class="translation">${translation}</div><div class="letters" aria-label="${word}">${[...word].map(l=>`<span class="letter">${l.toUpperCase()}</span>`).join('')}</div><div class="status" role="status" aria-live="polite"></div></div>`;track.append(card);return card});
const finish=document.createElement('section');finish.className='card';finish.setAttribute('aria-label','כרטיסיית סיום');finish.innerHTML=`<div class="card-inner finish-inner"><div class="finish-icon">⭐ 🏆</div><h1 class="finish-title">כל הכבוד!</h1><p class="finish-message">סיימתם את שיעור מספר ${lessonNumber} בהצלחה</p><div class="finish-badge">ממשיכים ללמוד ולהשתפר!</div><button class="copy-link" type="button">🔗 העתקת קישור לשיעור</button><p class="maker">Made Simon H</p></div>`;track.append(finish);const cards=[cover,...lessonCards,finish];
cards.forEach((_,i)=>{const dot=document.createElement('button');dot.className='dot';dot.type='button';dot.setAttribute('aria-label',`עבור לכרטיסייה ${i+1}`);dot.onclick=()=>goTo(i);dotsBox.append(dot)});const dots=[...dotsBox.children];function englishVoice(){const v=speechSynthesis.getVoices();return v.find(x=>x.lang==='en-US')||v.find(x=>x.lang.startsWith('en'))||null}function speak(text,rate,id){return new Promise(resolve=>{if(id!==runId)return resolve();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;const v=englishVoice();if(v)u.voice=v;u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u)})}
async function readCard(index){const id=++runId;speechSynthesis.cancel();lessonCards.forEach(card=>{card.querySelector('.word').classList.remove('done');card.querySelectorAll('.letter').forEach(x=>x.classList.remove('active'));card.querySelector('.status').textContent=''});if(index===0||index===cards.length-1)return;const wi=index-1,card=lessonCards[wi],word=words[wi][0],wordEl=card.querySelector('.word'),letters=[...card.querySelectorAll('.letter')],status=card.querySelector('.status');status.textContent='ממתינים…';await sleep(900);if(id!==runId)return;status.textContent='מקשיבים למילה';await speak(word,.8,id);if(id!==runId)return;status.textContent='עכשיו מאייתים';for(let i=0;i<word.length;i++){if(id!==runId)return;letters.forEach(x=>x.classList.remove('active'));letters[i].classList.add('active');await speak(word[i].toUpperCase(),1,id);await sleep(120)}if(id!==runId)return;letters.forEach(x=>x.classList.remove('active'));status.textContent='ושוב: המילה';await speak(word,.8,id);if(id!==runId)return;wordEl.classList.add('done');status.textContent='מצוין! אפשר להמשיך'}
async function copyLessonLink(button){const base=location.href.substring(0,location.href.lastIndexOf('/')+1),url=base+`lesson${lessonNumber}.html`;try{await navigator.clipboard.writeText(url)}catch{const t=document.createElement('textarea');t.value=url;document.body.append(t);t.select();document.execCommand('copy');t.remove()}const old=button.textContent;button.textContent='✓ הקישור הועתק';setTimeout(()=>button.textContent=old,1800)}document.querySelectorAll('.copy-link').forEach(b=>b.onclick=()=>copyLessonLink(b));
function goTo(i){current=Math.max(0,Math.min(cards.length-1,i));track.style.transform=`translateX(-${current*100}%)`;dots.forEach((d,j)=>d.classList.toggle('active',j===current));previousButton.disabled=current===0;nextButton.disabled=current===cards.length-1;readCard(current)}previousButton.onclick=()=>goTo(current-1);nextButton.onclick=()=>goTo(current+1);viewport.addEventListener('pointerdown',e=>startX=e.clientX);viewport.addEventListener('pointerup',e=>{if(startX===null)return;const d=e.clientX-startX;startX=null;if(Math.abs(d)>=45)goTo(current+(d<0?1:-1))});viewport.addEventListener('pointercancel',()=>startX=null);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')goTo(current-1);if(e.key==='ArrowRight')goTo(current+1)});window.addEventListener('beforeunload',()=>speechSynthesis.cancel());speechSynthesis.getVoices();goTo(0);
</script></body></html>
