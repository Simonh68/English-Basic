<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6c5ce7">
  <title>Listen &amp; Find – Basic English Reading</title>
  <meta name="description" content="A colorful listening and word-recognition game for beginning English readers.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Listen &amp; Find – Basic English Reading">
  <meta property="og:description" content="Listen to an English word and find it on the screen.">
  <meta property="og:image" content="https://simonh68.github.io/English-Basic/preview.png">
  <meta property="og:url" content="https://simonh68.github.io/English-Basic/word-game/">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="../favicon.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap');

    :root {
      --ink: #25304a;
      --purple: #6c5ce7;
      --pink: #f45da2;
      --green: #20b77a;
      --red: #ef5b68;
      --yellow: #ffd34e;
      --panel: rgba(255, 255, 255, .86);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overscroll-behavior: none;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      color: var(--ink);
      font-family: "Andika", "Trebuchet MS", sans-serif;
      background:
        radial-gradient(circle at 12% 16%, #fff3a8 0 6%, transparent 19%),
        radial-gradient(circle at 87% 12%, #ffc5df 0 7%, transparent 21%),
        radial-gradient(circle at 82% 86%, #aee8ff 0 8%, transparent 22%),
        linear-gradient(145deg, #eefcff, #f5edff 48%, #fff8dc);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body::before,
    body::after {
      position: fixed;
      z-index: -1;
      content: "";
      width: 34vmin;
      height: 34vmin;
      border-radius: 42% 58% 64% 36%;
      filter: blur(2px);
      opacity: .28;
      animation: drift 10s ease-in-out infinite alternate;
    }

    body::before { left: -11vmin; bottom: -9vmin; background: #53d7a1; }
    body::after { right: -12vmin; top: 32%; background: #8d7cf4; animation-delay: -4s; }

    button, a { font: inherit; }

    .app {
      width: min(980px, 100%);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: clamp(8px, 2vh, 16px);
    }

    .topbar {
      min-height: 46px;
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      gap: 8px;
    }

    .home,
    .sound-toggle {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 2px solid #ffffffd9;
      border-radius: 16px;
      background: #ffffffc9;
      color: var(--ink);
      box-shadow: 0 6px 15px #4a3b7422;
      text-decoration: none;
      font-size: 1.45rem;
      cursor: pointer;
    }

    .levels {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(5px, 2vw, 12px);
    }

    .level-pill {
      min-width: 42px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 2px solid #fff;
      border-radius: 999px;
      background: #ffffffa8;
      color: #7a7890;
      font-size: 1rem;
      font-weight: 700;
      box-shadow: 0 3px 8px #34266f19;
      transition: transform .35s, background .35s, color .35s, box-shadow .35s;
    }

    .level-pill.active {
      background: linear-gradient(135deg, var(--purple), #927df5);
      color: #fff;
      transform: scale(1.14);
      box-shadow: 0 7px 16px #6c5ce747;
    }

    .level-pill.passed { background: #ccf4e4; color: #13865a; }

    .listen-zone {
      display: grid;
      justify-items: center;
      gap: 5px;
    }

    .listen-button {
      position: relative;
      width: clamp(76px, 15vw, 108px);
      height: clamp(76px, 15vw, 108px);
      display: grid;
      place-items: center;
      padding: 0;
      border: 5px solid #fff;
      border-radius: 50%;
      background: linear-gradient(145deg, #ff76b6, #e74391);
      color: #fff;
      box-shadow: 0 10px 0 #bd2c72, 0 17px 31px #9c306744;
      font-size: clamp(2.2rem, 8vw, 3.8rem);
      line-height: 1;
      cursor: pointer;
      transition: transform .16s, box-shadow .16s;
    }

    .listen-button:active {
      transform: translateY(7px) scale(.98);
      box-shadow: 0 3px 0 #bd2c72, 0 9px 18px #9c306733;
    }

    .listen-button.speaking { animation: listenPulse 1s ease-in-out infinite; }

    .listen-button.speaking::before,
    .listen-button.speaking::after {
      position: absolute;
      content: "";
      inset: -12px;
      border: 4px solid #f45da278;
      border-radius: 50%;
      animation: soundRing 1.45s ease-out infinite;
    }

    .listen-button.speaking::after { animation-delay: .55s; }

    .streak {
      min-height: 27px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .streak-star {
      color: #ddd4c0;
      font-size: 1.3rem;
      filter: grayscale(1);
      transform: scale(.86);
      transition: transform .28s, color .28s, filter .28s;
    }

    .streak-star.on {
      color: var(--yellow);
      filter: none;
      transform: scale(1.16) rotate(-7deg);
      text-shadow: 0 3px 0 #e1a91c;
    }

    .choices {
      align-self: stretch;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-auto-rows: minmax(78px, 1fr);
      gap: clamp(8px, 1.8vw, 16px);
      padding: clamp(2px, 1vw, 8px);
    }

    .choice {
      --card: #fff;
      position: relative;
      min-width: 0;
      min-height: 78px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1px, .8vh, 6px);
      padding: clamp(7px, 2vw, 16px) 5px;
      border: 3px solid #fff;
      border-radius: clamp(18px, 4vw, 28px);
      background: var(--card);
      color: var(--ink);
      box-shadow: 0 8px 0 color-mix(in srgb, var(--card) 68%, #4d4466), 0 13px 23px #42376a29;
      cursor: pointer;
      transform: translateY(0);
      transition: transform .16s, box-shadow .16s, opacity .2s, background .2s;
    }

    .choice::after {
      position: absolute;
      right: -24px;
      bottom: -28px;
      width: 70px;
      height: 70px;
      content: "";
      border-radius: 50%;
      background: #ffffff50;
    }

    .choice:not(:disabled):hover { transform: translateY(-3px); }

    .choice:not(:disabled):active {
      transform: translateY(7px) scale(.98);
      box-shadow: 0 2px 0 color-mix(in srgb, var(--card) 65%, #4d4466), 0 7px 12px #42376a20;
    }

    .choice:disabled { cursor: default; opacity: .68; }

    .choice.correct {
      --card: #6ee3ad;
      opacity: 1;
      animation: correctPop .7s cubic-bezier(.2, .8, .2, 1);
      box-shadow: 0 8px 0 #189866, 0 13px 25px #1ba06a45;
    }

    .choice.wrong {
      --card: #ff9aa4;
      opacity: 1;
      animation: shake .42s ease;
      box-shadow: 0 8px 0 #d94353, 0 13px 25px #bd374442;
    }

    .choice-word {
      position: relative;
      z-index: 1;
      max-width: 100%;
      overflow: hidden;
      color: #1c2844;
      font-size: clamp(1.45rem, 5.5vw, 3.15rem);
      font-weight: 700;
      line-height: 1.08;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .choice-emoji {
      position: relative;
      z-index: 1;
      font-family: system-ui, sans-serif;
      font-size: clamp(1.25rem, 4.5vw, 2.5rem);
      line-height: 1;
      opacity: .76;
    }

    .choices[data-count="7"] .choice-word,
    .choices[data-count="9"] .choice-word { font-size: clamp(1.2rem, 4.4vw, 2.4rem); }

    .choices[data-count="7"] .choice-emoji,
    .choices[data-count="9"] .choice-emoji { font-size: clamp(1.05rem, 3.6vw, 1.9rem); opacity: .63; }

    .start-screen {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      background:
        radial-gradient(circle at 50% 30%, #fff7ad 0 8%, transparent 29%),
        linear-gradient(145deg, #9a8cff, #ff92c7 52%, #73dfbd);
      transition: opacity .45s, visibility .45s;
    }

    .start-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .start-card {
      width: min(430px, 92vw);
      display: grid;
      justify-items: center;
      gap: clamp(18px, 4vh, 32px);
      padding: clamp(28px, 7vw, 52px);
      border: 5px solid #ffffffd9;
      border-radius: 42px;
      background: #ffffffdf;
      box-shadow: 0 22px 55px #50347450;
    }

    .abc {
      display: flex;
      gap: 7px;
      font-size: clamp(3rem, 17vw, 6.2rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -7px;
    }

    .abc span:nth-child(1) { color: #6c5ce7; transform: rotate(-9deg); }
    .abc span:nth-child(2) { color: #f45da2; transform: translateY(9px); }
    .abc span:nth-child(3) { color: #19a871; transform: rotate(9deg); }

    .start-button {
      width: clamp(118px, 32vw, 158px);
      height: clamp(118px, 32vw, 158px);
      display: grid;
      place-items: center;
      padding: 0;
      border: 7px solid #fff;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffcb3e, #ff8d42);
      box-shadow: 0 12px 0 #d95f2f, 0 19px 30px #95452f45;
      color: #fff;
      font-size: clamp(3.8rem, 14vw, 5.8rem);
      cursor: pointer;
      animation: startBounce 1.8s ease-in-out infinite;
    }

    .start-decor { font: 2.2rem/1 system-ui, sans-serif; letter-spacing: 8px; }

    .celebration {
      position: fixed;
      z-index: 30;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .burst-star {
      position: absolute;
      left: 50%;
      top: 50%;
      font: clamp(1.7rem, 6vw, 3.7rem)/1 system-ui, sans-serif;
      opacity: 0;
      animation: burst 1s cubic-bezier(.1, .75, .25, 1) forwards;
    }

    .center-win {
      position: absolute;
      left: 50%;
      top: 50%;
      display: grid;
      place-items: center;
      width: clamp(105px, 25vw, 160px);
      height: clamp(105px, 25vw, 160px);
      border: 7px solid #fff;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffe36a, #ff9f43);
      box-shadow: 0 18px 42px #b9693155;
      font: clamp(3.8rem, 13vw, 6.5rem)/1 system-ui, sans-serif;
      transform: translate(-50%, -50%) scale(0);
      animation: winPop .82s cubic-bezier(.2, .9, .2, 1) forwards;
    }

    .retry-symbol {
      position: fixed;
      z-index: 15;
      left: 50%;
      top: 35%;
      display: grid;
      place-items: center;
      width: 70px;
      height: 70px;
      border: 5px solid #fff;
      border-radius: 50%;
      background: #ff9aa4;
      box-shadow: 0 10px 24px #b73a4a40;
      color: #fff;
      font: 2.5rem/1 system-ui, sans-serif;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(.5);
    }

    .retry-symbol.show { animation: retryPop .8s ease; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes listenPulse { 50% { transform: scale(1.07); } }
    @keyframes soundRing { from { transform: scale(.75); opacity: .8; } to { transform: scale(1.42); opacity: 0; } }
    @keyframes correctPop { 35% { transform: scale(1.08) rotate(-2deg); } 70% { transform: scale(.98) rotate(1deg); } }
    @keyframes shake { 20%, 60% { transform: translateX(-9px); } 40%, 80% { transform: translateX(9px); } }
    @keyframes startBounce { 50% { transform: translateY(-8px) scale(1.03); } }
    @keyframes drift { to { transform: translate(7vmin, -5vmin) rotate(35deg); } }
    @keyframes winPop { 45% { transform: translate(-50%, -50%) scale(1.13) rotate(-7deg); } 72% { transform: translate(-50%, -50%) scale(.96) rotate(4deg); } 100% { transform: translate(-50%, -50%) scale(1); } }
    @keyframes retryPop { 25% { opacity: 1; transform: translate(-50%, -50%) scale(1.08) rotate(-20deg); } 65% { opacity: 1; transform: translate(-50%, -50%) scale(.95) rotate(20deg); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(.7); } }
    @keyframes burst {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(0); }
      16% { opacity: 1; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.15) rotate(var(--r)); }
    }

    @media (max-width: 520px) {
      .app { gap: 7px; }
      .topbar { grid-template-columns: 42px 1fr 42px; min-height: 41px; }
      .home, .sound-toggle { width: 40px; height: 40px; border-radius: 13px; font-size: 1.18rem; }
      .level-pill { min-width: 34px; height: 29px; font-size: .9rem; }
      .listen-button { border-width: 4px; box-shadow: 0 7px 0 #bd2c72, 0 12px 23px #9c30673b; }
      .streak { min-height: 23px; }
      .choice { border-width: 2px; border-radius: 17px; box-shadow: 0 6px 0 color-mix(in srgb, var(--card) 68%, #4d4466), 0 9px 16px #42376a22; }
    }

    @media (max-height: 680px) {
      .app { gap: 5px; }
      .topbar { min-height: 36px; }
      .home, .sound-toggle { width: 36px; height: 36px; border-radius: 12px; font-size: 1.05rem; }
      .level-pill { height: 27px; min-width: 33px; }
      .listen-button { width: 65px; height: 65px; font-size: 2rem; border-width: 4px; }
      .streak { min-height: 19px; }
      .streak-star { font-size: 1rem; }
      .choices { gap: 7px; grid-auto-rows: minmax(57px, 1fr); }
      .choice { min-height: 57px; padding: 4px; }
      .choice-word { font-size: clamp(1.1rem, 4.2vw, 2.1rem); }
      .choice-emoji { font-size: clamp(.95rem, 3.5vw, 1.5rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Listen and find the English word">
    <header class="topbar">
      <a class="home" href="../" aria-label="Back to English Basic">⌂</a>
      <div class="levels" id="levels" aria-label="Difficulty level">
        <span class="level-pill active">3</span>
        <span class="level-pill">5</span>
        <span class="level-pill">7</span>
        <span class="level-pill">9</span>
      </div>
      <button class="sound-toggle" id="soundToggle" type="button" aria-label="Turn sound effects off">♪</button>
    </header>

    <section class="listen-zone">
      <button class="listen-button" id="listenButton" type="button" aria-label="Hear the word again">🔊</button>
      <div class="streak" id="streak" aria-label="Three correct answers to level up">
        <span class="streak-star">★</span>
        <span class="streak-star">★</span>
        <span class="streak-star">★</span>
      </div>
    </section>

    <section class="choices" id="choices" data-count="3" aria-label="Choose the word"></section>
  </main>

  <section class="start-screen" id="startScreen">
    <div class="start-card">
      <div class="abc" aria-hidden="true"><span>A</span><span>B</span><span>C</span></div>
      <button class="start-button" id="startButton" type="button" aria-label="Start the listening game">▶</button>
      <div class="start-decor" aria-hidden="true">👂 ⭐ 🔤</div>
    </div>
  </section>

  <div class="celebration" id="celebration" aria-hidden="true"></div>
  <div class="retry-symbol" id="retrySymbol" aria-hidden="true">↻</div>
  <div class="sr-only" id="liveStatus" role="status" aria-live="polite"></div>

  <script>
    const LEVEL_COUNTS = [3, 5, 7, 9];
    const CARD_COLORS = ["#fff0a8", "#c9f4df", "#cfe7ff", "#f8d2e7", "#e5d7ff", "#ffd7ba", "#d7f3f5", "#f5e6b8", "#dce7ff"];

    // The levels move from short, regular words to common school words and actions.
    const WORDS = [

      { w: "run", emoji: "🏃", tier: 3, pattern: "action" },

      { w: "help", emoji: "🤝", tier: 3, pattern: "action" },
      { w: "eat", emoji: "🍽️", tier: 3, pattern: "action" },
      { w: "drink", emoji: "🥤", tier: 3, pattern: "action" },
      { w: "walk", emoji: "🚶", tier: 3, pattern: "action" },
      { w: "friend", emoji: "🧑‍🤝‍🧑", tier: 3, pattern: "school" },
      { w: "teacher", emoji: "🧑‍🏫", tier: 3, pattern: "school" }
    ];

    const choicesBox = document.querySelector("#choices");
    const listenButton = document.querySelector("#listenButton");
    const levelsBox = document.querySelector("#levels");
    const levelPills = [...levelsBox.children];
    const streakStars = [...document.querySelectorAll(".streak-star")];
    const startScreen = document.querySelector("#startScreen");
    const startButton = document.querySelector("#startButton");
    const celebration = document.querySelector("#celebration");
    const retrySymbol = document.querySelector("#retrySymbol");
    const liveStatus = document.querySelector("#liveStatus");
    const soundToggle = document.querySelector("#soundToggle");

    let level = 0;
    let cleanStreak = 0;
    let recoveryTarget = null;
    let recoveryWins = 0;
    let target = null;
    let previousTarget = null;
    let wrongAttempts = 0;
    let roundToken = 0;
    let inputLocked = true;
    let soundEffects = true;
    let audioContext = null;
    const stats = new Map(WORDS.map(word => [word.w, { seen: 0, correct: 0, mistakes: 0 }]));

    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const shuffle = list => [...list].sort(() => Math.random() - .5);

    function getVoice() {
      const voices = speechSynthesis.getVoices();
      return voices.find(v => v.lang === "en-US" && /Samantha|Google|Microsoft|Ava|Jenny/i.test(v.name))
        || voices.find(v => v.lang === "en-US")
        || voices.find(v => v.lang.startsWith("en"))
        || null;
    }

    function speak(word, token) {
      return new Promise(resolve => {
        if (token !== roundToken) return resolve();
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = "en-US";
        utterance.rate = .72;
        utterance.pitch = 1.02;
        const voice = getVoice();
        if (voice) utterance.voice = voice;
        utterance.onend = resolve;
        utterance.onerror = resolve;
        speechSynthesis.speak(utterance);
      });
    }

    function setChoicesEnabled(enabled) {
      inputLocked = !enabled;
      [...choicesBox.children].forEach(button => button.disabled = !enabled);
    }

    async function readTarget(repetitions = 3) {
      if (!target) return;
      const token = roundToken;
      speechSynthesis.cancel();
      setChoicesEnabled(false);
      listenButton.classList.add("speaking");
      listenButton.setAttribute("aria-label", "Listening");
      for (let i = 0; i < repetitions; i++) {
        if (token !== roundToken) return;
        await speak(target.w, token);
        if (i < repetitions - 1) await wait(2000);
      }
      if (token !== roundToken) return;
      listenButton.classList.remove("speaking");
      listenButton.setAttribute("aria-label", "Hear the word again");
      setChoicesEnabled(true);
      liveStatus.textContent = "Choose the word you heard.";
    }

    function wordScore(word) {
      const record = stats.get(word.w);
      const unseenBonus = record.seen === 0 ? 8 : 0;
      const retryBonus = record.mistakes * 4;
      const masteryPenalty = record.correct * 1.4;
      const levelBonus = word.tier === level ? 3 : 0;
      const repeatPenalty = previousTarget && word.w === previousTarget.w ? 20 : 0;
      return unseenBonus + retryBonus - masteryPenalty + levelBonus - repeatPenalty + Math.random() * 3;
    }

    function chooseTarget() {
      const pool = WORDS.filter(word => word.tier <= level);
      return [...pool].sort((a, b) => wordScore(b) - wordScore(a))[0];
    }

    function chooseDistractors(currentTarget, amount) {
      const pool = WORDS.filter(word => word.w !== currentTarget.w && word.tier <= level);
      const ranked = pool.map(word => {
        let score = Math.random() * 2;
        if (word.pattern === currentTarget.pattern) score += 5;
        if (word.w.length === currentTarget.w.length) score += 3;
        if (word.tier === currentTarget.tier) score += 2;
        return { word, score };
      }).sort((a, b) => b.score - a.score);
      return shuffle(ranked.slice(0, Math.max(amount + 4, 12)).map(item => item.word)).slice(0, amount);
    }

    function renderLevel() {
      levelPills.forEach((pill, index) => {
        pill.classList.toggle("active", index === level);
        pill.classList.toggle("passed", index < level);
      });
      streakStars.forEach((star, index) => star.classList.toggle("on", index < cleanStreak));
    }

    function renderChoices(words) {
      choicesBox.replaceChildren();
      choicesBox.dataset.count = String(words.length);
      words.forEach((word, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";
        button.style.setProperty("--card", CARD_COLORS[index % CARD_COLORS.length]);
        button.setAttribute("aria-label", word.w);
        button.innerHTML = `<span class="choice-word" lang="en">${word.w}</span><span class="choice-emoji" aria-hidden="true">${word.emoji}</span>`;
        button.addEventListener("click", () => checkChoice(word, button));
        choicesBox.append(button);
      });
    }

    async function newRound() {
      roundToken += 1;
      speechSynthesis.cancel();
      inputLocked = true;
      wrongAttempts = 0;
      previousTarget = target;
      target = chooseTarget();
      stats.get(target.w).seen += 1;
      const optionCount = LEVEL_COUNTS[level];
      const options = shuffle([target, ...chooseDistractors(target, optionCount - 1)]);
      renderLevel();
      renderChoices(options);
      await wait(280);
      readTarget(3);
    }

    function ensureAudio() {
      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioContext = new AudioCtx();
      }
      if (audioContext?.state === "suspended") audioContext.resume();
    }

    function tone(frequency, start, duration, volume = .06, type = "sine") {
      if (!soundEffects || !audioContext) return;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, start);
      gain.gain.setValueAtTime(.001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + .025);
      gain.gain.exponentialRampToValueAtTime(.001, start + duration);
      oscillator.connect(gain).connect(audioContext.destination);
      oscillator.start(start);
      oscillator.stop(start + duration + .03);
    }

    function playSuccessSound(big = false) {
      ensureAudio();
      if (!audioContext) return;
      const now = audioContext.currentTime;
      tone(523.25, now, .18, .07, "triangle");
      tone(659.25, now + .11, .2, .07, "triangle");
      tone(big ? 1046.5 : 783.99, now + .22, .3, .075, "triangle");
    }

    function playTryAgainSound() {
      ensureAudio();
      if (!audioContext) return;
      const now = audioContext.currentTime;
      tone(330, now, .12, .035, "sine");
      tone(277, now + .1, .16, .03, "sine");
    }

    function showCelebration(big = false) {
      celebration.replaceChildren();
      const center = document.createElement("div");
      center.className = "center-win";
      center.textContent = big ? "🏆" : "⭐";
      celebration.append(center);
      const symbols = big ? ["⭐", "✨", "🌟", "🎉", "🏆"] : ["⭐", "✨", "🌟"];
      const count = big ? 20 : 13;
      for (let i = 0; i < count; i++) {
        const star = document.createElement("span");
        const angle = (Math.PI * 2 * i / count) + Math.random() * .25;
        const distance = (big ? 30 : 23) + Math.random() * 28;
        star.className = "burst-star";
        star.textContent = symbols[i % symbols.length];
        star.style.setProperty("--x", `${Math.cos(angle) * distance}vmin`);
        star.style.setProperty("--y", `${Math.sin(angle) * distance}vmin`);
        star.style.setProperty("--r", `${Math.round(Math.random() * 240 - 120)}deg`);
        star.style.animationDelay = `${Math.random() * .12}s`;
        celebration.append(star);
      }
      setTimeout(() => celebration.replaceChildren(), 1200);
    }

    function showRetry() {
      retrySymbol.classList.remove("show");
      void retrySymbol.offsetWidth;
      retrySymbol.classList.add("show");
    }

    function updateAdaptiveLevel(cleanAnswer) {
      let bigCelebration = false;

      if (wrongAttempts >= 2 && level > 0) {
        recoveryTarget = Math.max(recoveryTarget ?? level, level);
        level -= 1;
        recoveryWins = 0;
        cleanStreak = 0;
        return bigCelebration;
      }

      if (!cleanAnswer) {
        cleanStreak = 0;
        recoveryWins = 0;
        return bigCelebration;
      }

      if (recoveryTarget !== null) {
        recoveryWins += 1;
        cleanStreak = Math.min(2, recoveryWins);
        if (recoveryWins >= 2) {
          level = Math.min(recoveryTarget, level + 1);
          recoveryWins = 0;
          cleanStreak = 0;
          bigCelebration = true;
          if (level >= recoveryTarget) recoveryTarget = null;
        }
        return bigCelebration;
      }

      cleanStreak += 1;
      if (cleanStreak >= 3) {
        cleanStreak = 0;
        if (level < LEVEL_COUNTS.length - 1) level += 1;
        bigCelebration = true;
      }
      return bigCelebration;
    }

    async function checkChoice(word, button) {
      if (inputLocked) return;
      ensureAudio();

      if (word.w !== target.w) {
        inputLocked = true;
        wrongAttempts += 1;
        stats.get(target.w).mistakes += 1;
        cleanStreak = 0;
        renderLevel();
        button.classList.add("wrong");
        playTryAgainSound();
        showRetry();
        liveStatus.textContent = "Try again.";
        await wait(560);
        button.classList.remove("wrong");
        await readTarget(1);
        return;
      }

      setChoicesEnabled(false);
      const cleanAnswer = wrongAttempts === 0;
      stats.get(target.w).correct += 1;
      button.classList.add("correct");
      const bigCelebration = updateAdaptiveLevel(cleanAnswer);
      renderLevel();
      playSuccessSound(bigCelebration);
      showCelebration(bigCelebration);
      liveStatus.textContent = bigCelebration ? "Excellent! New level." : "Correct!";
      await wait(bigCelebration ? 1500 : 1050);
      newRound();
    }

    listenButton.addEventListener("click", () => {
      if (!target || listenButton.classList.contains("speaking")) return;
      ensureAudio();
      readTarget(1);
    });

    soundToggle.addEventListener("click", () => {
      soundEffects = !soundEffects;
      soundToggle.textContent = soundEffects ? "♪" : "🔇";
      soundToggle.setAttribute("aria-label", soundEffects ? "Turn sound effects off" : "Turn sound effects on");
    });

    startButton.addEventListener("click", () => {
      ensureAudio();
      speechSynthesis.getVoices();
      startScreen.classList.add("hidden");
      newRound();
    }, { once: true });

    window.addEventListener("beforeunload", () => speechSynthesis.cancel());
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        roundToken += 1;
        speechSynthesis.cancel();
        listenButton.classList.remove("speaking");
      }
    });

    speechSynthesis.getVoices();
  </script>
</body>
</html>
