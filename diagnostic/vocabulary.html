<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1730">
  <meta name="robots" content="noindex,nofollow">
  <title>מבחן אנגלית | English for Noar</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../app.css?v=5">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body class="home-page diagnostic-page exam-page">
  <a class="skip-link" href="#mainContent">דלגו לתוכן הראשי</a>
  <header class="home-topbar diagnostic-topbar" aria-label="ניווט ראשי">
    <a class="home-brand" href="../index.html" aria-label="English Basic – דף הבית">
      <span class="brand-mark" aria-hidden="true">EB</span>
      <span><strong lang="en" dir="ltr">English for Noar</strong><small>מבחן אנגלית</small></span>
    </a>
    <nav class="home-nav" aria-label="קישורים ראשיים">
      <a class="home-return" href="../index.html">⌂ דף הבית</a>
    </nav>
  </header>

  <main id="mainContent" class="exam-shell">
    <section id="loadingView" class="exam-panel status-panel" aria-live="polite">
      <div class="loading-orb" aria-hidden="true"></div>
      <h1>מכינים את המבחן…</h1>
    </section>

    <section id="questionView" class="exam-panel question-panel" hidden aria-labelledby="questionTitle">
      <div class="exam-progress-row">
        <span id="sectionLabel">אוצר מילים</span>
        <strong id="questionCounter">1 / 15</strong>
      </div>
      <div class="exam-progress" role="progressbar" aria-label="התקדמות במבחן" aria-valuemin="0" aria-valuemax="15" aria-valuenow="1"><span id="progressBar"></span></div>

      <div class="question-timer" id="questionTimer" aria-label="זמן לשאלה">
        <div><strong id="timerValue">10.0</strong><small>שניות</small></div>
        <span class="timer-line" aria-hidden="true"><i id="timerTrack"></i></span>
      </div>

      <div class="vocab-prompt" id="vocabPrompt">
        <span class="prompt-label" id="promptLabel">מה משמעות המילה?</span>
        <h1 id="questionTitle" lang="en" dir="ltr"></h1>
        <p id="exampleSentence" lang="en" dir="ltr"></p>
      </div>
      <div class="answer-grid vocab-answers" id="answerGrid" aria-label="תשובות אפשריות"></div>
      <button class="unknown-button" id="unknownButton" type="button">לא יודע/ת</button>
    </section>

    <section id="transitionView" class="exam-panel status-panel transition-panel" hidden aria-live="polite">
      <div class="transition-mark" aria-hidden="true">✓</div>
      <h1>ממשיכים להבנת הנקרא</h1>
    </section>
  </main>

  <script src="common.js?v=4"></script>
  <script src="vocabulary.js?v=4"></script>
  <script src="../analytics.js"></script>
</body>
</html>
