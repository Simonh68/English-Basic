<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#08121d">
<meta name="author" content="Simon Halevi"><meta name="copyright" content="© 2026 שמעון הרצל הלוי גובני. כל הזכויות שמורות.">
<meta name="description" content="Word Forge — רצף זיכרון. גרסת ניסוי עצמאית לקריאה ואיות באנגלית.">
<title>Word Forge · רצף זיכרון</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2308121d'/%3E%3Cpath d='M7 11l5 19 8-13 8 13 5-19' fill='none' stroke='%2375efbe' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>/* INLINE_STYLE */</style>
</head>
<body>
<div class="shell">
  <header class="top"><div class="brand" dir="ltr"><span class="brand-mark" aria-hidden="true">W</span><div><strong>WORD FORGE</strong><span>MEMORY RUN</span></div></div><div class="top-actions"><button class="icon-button" id="sound" aria-label="הפעלת שמע" aria-pressed="false">♪</button><button class="icon-button" id="help" aria-label="איך משחקים">?</button></div></header>
  <div class="route"><button class="stage-picker" id="stages" aria-haspopup="dialog">שלב 1</button><span class="sr-only" id="focusText"></span><span class="cap-label" id="capLabel"></span></div>
  <p class="toast" id="speechStatus" role="status" hidden></p>
  <main id="main" tabindex="-1"></main>
  <footer><span>English for Noar · Simon Halevi</span></footer>
</div>
<dialog id="stageDialog" aria-labelledby="stageTitle"><div class="dialog-top"><h2 id="stageTitle" class="sr-only">בחירת שלב</h2><span aria-hidden="true">▦</span><button class="icon-button" data-close aria-label="סגירה">×</button></div><div id="stageOptions"></div><div id="stageConfirm" hidden><div id="stageConfirmText"></div><div class="actions"><button class="action secondary" id="keepStage" aria-label="להישאר במשחק">↩</button><button class="action primary" id="changeStage" aria-label="לעבור לשלב שנבחר ולאפס את נקודות השלב הנוכחי">→</button></div></div></dialog>
<dialog id="helpDialog" aria-labelledby="helpTitle"><div class="dialog-top"><h2 id="helpTitle" class="sr-only">איך משחקים — הסבר חזותי</h2><span aria-hidden="true">?</span><button class="icon-button" data-close aria-label="סגירה">×</button></div><div class="visual-help" dir="ltr"><div aria-label="מסתכלים במילה, ואז בוחרים את האות החסרה"><span>👁</span><b>cat</b><span>→</span><b>c<span class="missing">_</span>t</b></div><div aria-label="תשובה נכונה מעניקה מטבעות"><b class="sample-choice">a</b><span>→</span><span>✓</span><b class="help-coins">★ +10</b></div><div aria-label="שמירת יותר מילים מאפשרת פרס גדול יותר"><span>🎲</span><b class="help-coins">10 → 25 → 47</b></div><div aria-label="טעות יכולה להפחית נקודות בשלב, עד לאפס"><span>×</span><b>−</b><span class="help-coins">★</span></div><div aria-label="עזרה מציגה את המילה ללא נקודות"><span>👁</span><b>cat</b><span>→</span><b class="help-coins">★ 0</b></div></div><label class="setting" aria-label="תנועה מופחתת"><input type="checkbox" id="motion"><span aria-hidden="true">◌ → ●</span></label></dialog>
<div class="sr-only" id="announce" aria-live="polite" aria-atomic="true"></div>
<noscript>כדי לשחק יש לפתוח את הקובץ בדפדפן שבו JavaScript פעיל.</noscript>
<script>/* INLINE_SCRIPT */</script>
</body></html>
