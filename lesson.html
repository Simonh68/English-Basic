<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#14213d">
  <title>English Basic – שיעור</title>

    <div class="lesson-profile" id="profileStats" aria-label="נקודות ורצף תרגול">0 XP · 0 ימים</div>
