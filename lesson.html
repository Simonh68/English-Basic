<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14213d">
  <title>English Basic – שיעור</title>
  <meta name="description" content="תרגול קריאה ואיות באנגלית לפי רמות">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="app.css?v=6">
</head>
<body>
  <a class="skip-link" href="#lessonMain">דלגו לתרגול</a>
  <header class="site-header">
    <a class="home-icon" href="index.html" aria-label="דף הבית">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 10.8 12 3l9 7.8v9.7a.5.5 0 0 1-.5.5H15v-6H9v6H3.5a.5.5 0 0 1-.5-.5z"/>
      </svg>
    </a>
    <a class="brand" href="index.html">English Basic</a>
    <div class="lesson-profile" id="profileStats" aria-label="0 נקודות, 0 ימי רצף">
      <span id="profileXP" dir="ltr">0 XP</span><span aria-hidden="true">·</span><span id="profileStreak">0 ימים</span>
    </div>
    <div class="selectors">
      <label><span>רמה</span><select id="levelSelect" aria-label="בחירת רמה"></select></label>
      <label><span>שיעור</span><select id="lessonSelect" aria-label="בחירת שיעור"></select></label>
    </div>
  </header>
  <nav class="mode-nav" id="modeNav" aria-label="מצבי תרגול"></nav>
  <main class="lesson-shell" id="lessonMain">
    <div class="lesson-title">
      <div><h1 id="lessonHeading"></h1><p id="lessonFocus"></p></div>
      <span class="progress-chip" id="progressChip" role="status" aria-live="polite" aria-atomic="true">התקדמות מקומית</span>
    </div>
    <section class="panel">
      <div id="cardsPanel" class="mode-panel active"></div>
      <div id="listenPanel" class="mode-panel"></div>
      <div id="readPanel" class="mode-panel"></div>
      <div id="transferPanel" class="mode-panel"></div>
      <div id="sentencesPanel" class="mode-panel"></div>
      <div id="textPanel" class="mode-panel"></div>
      <div id="checkPanel" class="mode-panel"></div>
    </section>
  </main>
  <div class="xp-live" id="xpLive" role="status" aria-live="polite"></div>
  <script src="curriculum-data.js?v=1"></script>
  <script src="progress.js?v=1"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
